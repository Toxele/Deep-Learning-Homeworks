[project]
name = "deep-learning-homeworks"
version = "0.1.0"
description = "Deeplearning homeworks"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.7",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py310"
extend-exclude = ["data", "runs_hw2", "yellow-sticky-traps-dataset-main"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "PERF", "ASYNC", "BLE", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003", "E111", "E114", "E117"]

[tool.ruff.lint.per-file-ignores]
# Сохраняем сигнатуры, dict(...) и математические имена из учебного шаблона.
# Последняя строка ячейки может выводить результат без print.
"*.ipynb" = ["ANN", "B018", "C408", "E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = false
